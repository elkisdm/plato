[project]
name = "plato-analyzer"
version = "0.1.0"
description = "Plató — crew de análisis de video que escribe el VideoSpec canónico"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "jsonschema>=4.21",
    "pillow>=12.2.0",
    "pytesseract>=0.3.13",
    "scenedetect[opencv]>=0.7",
    "typer>=0.12",
]

[project.scripts]
plato = "plato_analyzer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "datamodel-code-generator>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plato_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
